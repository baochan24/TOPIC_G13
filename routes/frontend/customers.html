<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý khách hàng | EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .page-container { max-width: 1200px; margin: 20px auto; }
    .card { border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .back-btn { position: fixed; top: 16px; left: 16px; z-index: 1000; }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Trang chủ</a>

  <div class="container page-container">
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="fa-solid fa-users me-2"></i>Quản lý khách hàng</h5>
      </div>
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-md-8">
            <input type="text" id="searchQ" class="form-control" placeholder="Tìm theo tên, SĐT, email...">
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-primary w-100" onclick="loadCustomers()"><i class="fa-solid fa-search me-1"></i>Tìm</button>
          </div>
          <div class="col-md-2">
            <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#modalCustomer" onclick="openModalCustomer()"><i class="fa-solid fa-plus me-1"></i>Thêm</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>SĐT</th>
                <th>Email</th>
                <th>Địa chỉ</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="customersTable"></tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-2">
          <small class="text-muted" id="paginationInfo">-</small>
          <div>
            <button class="btn btn-sm btn-outline-secondary me-1" id="btnPrev" onclick="goPage(-1)">Trước</button>
            <span id="pageNum">1</span>
            <button class="btn btn-sm btn-outline-secondary ms-1" id="btnNext" onclick="goPage(1)">Sau</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal thêm/sửa khách hàng -->
  <div class="modal fade" id="modalCustomer" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalCustomerTitle">Thêm khách hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editCustomerId">
          <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input type="text" id="custFullName" class="form-control" placeholder="Nguyễn Văn A">
          </div>
          <div class="mb-3">
            <label class="form-label">Số điện thoại *</label>
            <input type="text" id="custPhone" class="form-control" placeholder="0912345678" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="custEmail" class="form-control" placeholder="email@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <input type="text" id="custAddress" class="form-control" placeholder="Địa chỉ">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" onclick="saveCustomer()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal lịch sử -->
  <div class="modal fade" id="modalHistory" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Lịch sử khách hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="historyBody"></div>
      </div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/customers.js"></script>
</body>
</html>
