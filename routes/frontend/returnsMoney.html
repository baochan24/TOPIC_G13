<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trả hàng / Hoàn tiền | EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .page-container { max-width: 1000px; margin: 20px auto; }
    .card { border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 1rem; }
    .back-btn { position: fixed; top: 16px; left: 16px; z-index: 1000; }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Trang chủ</a>

  <div class="container page-container">
    <h4 class="mb-3"><i class="fa-solid fa-undo me-2"></i>Trả hàng / Hoàn tiền</h4>

    <!-- Admin: Danh sách yêu cầu trả hàng -->
    <div class="card">
      <div class="card-header bg-warning text-dark"><i class="fa-solid fa-list me-2"></i>Danh sách yêu cầu trả hàng (Admin)</div>
      <div class="card-body">
        <button id="loadReturnRequestsBtn" class="btn btn-outline-primary mb-2">Tải danh sách</button>
        <div class="table-responsive">
          <table class="table table-sm table-hover" id="returnsTable">
            <thead class="table-dark"><tr><th>Mã trả</th><th>Order item</th><th>Lý do</th><th>Hoàn tiền</th><th>Ngày trả</th><th>Thao tác</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Admin: Xử lý (modal) -->
    <div class="modal fade" id="modalProcess" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Duyệt / Từ chối trả hàng</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="processReturnId">
            <div class="mb-3">
              <label class="form-check"><input type="checkbox" id="processApprove" class="form-check-input" checked> Duyệt trả hàng & hoàn tiền</label>
            </div>
            <div class="mb-3">
              <label class="form-check"><input type="checkbox" id="processRestock" class="form-check-input" checked> Nhập lại kho (nếu duyệt)</label>
            </div>
            <div class="mb-3">
              <label class="form-label">Ghi chú</label>
              <input type="text" id="processNote" class="form-control" placeholder="(tự động 'Quá hạn 7 ngày' nếu từ chối)">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="button" id="doProcessReturnBtn" class="btn btn-primary">Xử lý</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Khách: Tạo yêu cầu trả hàng -->
    <div class="card">
      <div class="card-header"><i class="fa-solid fa-plus me-2"></i>Tạo yêu cầu trả hàng (Khách hàng)</div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Mã order_item_id *</label>
          <input type="text" id="reqOrderItemId" class="form-control" placeholder="OI-xxxxxxxx">
        </div>
        <div class="mb-3">
          <label class="form-label">Lý do</label>
          <input type="text" id="reqReason" class="form-control" placeholder="Lý do trả hàng">
        </div>
        <button id="requestReturnBtn" class="btn btn-info">Gửi yêu cầu</button>
      </div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/returnsMoney.js?v=1"></script>
</body>
</html>
