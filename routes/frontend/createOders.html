<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tạo đơn hàng | EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .page-container { max-width: 900px; margin: 20px auto; }
    .card { border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .back-btn { position: fixed; top: 16px; left: 16px; z-index: 1000; }
    .imei-tag { display: inline-block; margin: 4px; padding: 4px 10px; background: #e9ecef; border-radius: 6px; }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Trang chủ</a>

  <div class="container page-container">
    <div class="card">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0"><i class="fa-solid fa-cart-plus me-2"></i>Lập đơn hàng (Checkout)</h5>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Mã khách hàng <small class="text-muted">(để trống nếu khách vãng lai)</small></label>
          <input type="text" id="customerId" class="form-control" placeholder="C-xxxxxxxx">
        </div>
        <div class="mb-3">
          <label class="form-label">Phương thức thanh toán</label>
          <select id="paymentMethod" class="form-select">
            <option value="CASH">Tiền mặt</option>
            <option value="BANK">Chuyển khoản</option>
            <option value="CARD">Thẻ</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Danh sách IMEI * <small class="text-muted">(mỗi IMEI một dòng hoặc cách nhau dấu phẩy)</small></label>
          <textarea id="imeisInput" class="form-control" rows="4" placeholder="IMEI1&#10;IMEI2&#10;..."></textarea>
          <div id="imeisPreview" class="mt-2"></div>
        </div>
        <div id="checkoutResult" class="alert d-none"></div>
        <button id="doCheckoutBtn" class="btn btn-success btn-lg w-100">
          <i class="fa-solid fa-check me-2"></i>Lập đơn hàng
        </button>
      </div>
    </div>
  </div>

<script src="./js/api.js?v=1" defer></script>
<script src="./js/createOders.js?v=1" defer></script>

</body>
</html>
