<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý nhân viên | EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .page-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin: 20px auto;
      max-width: 1400px;
    }
    .page-header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      padding: 25px;
      margin-bottom: 30px;
    }
    .table-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .btn-custom {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 25px;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Trang chủ</a>

  <div class="container-fluid page-container">
    <div class="page-header">
      <h2><i class="fa-solid fa-users me-2"></i>Quản lý nhân viên</h2>
      <p class="mb-0">Thêm, sửa, xóa nhân viên hệ thống</p>
    </div>

    <!-- Form thêm nhân viên -->
    <div class="form-card">
      <h5 class="mb-3"><i class="fa-solid fa-user-plus me-2"></i>Thêm nhân viên mới</h5>
      <form id="addStaffForm">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Tên đăng nhập *</label>
            <input type="text" class="form-control" id="username" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Mật khẩu *</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Số điện thoại *</label>
            <input type="tel" class="form-control" id="phone" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Họ tên *</label>
            <input type="text" class="form-control" id="fullName" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Địa chỉ</label>
            <input type="text" class="form-control" id="address">
          </div>
          <div class="col-md-4">
            <label class="form-label">Vai trò *</label>
            <select class="form-select" id="role" required>
              <option value="STAFF">Nhân viên</option>
              <option value="ADMIN">Quản trị viên</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-custom mt-3">
          <i class="fa-solid fa-plus me-2"></i>Thêm nhân viên
        </button>
      </form>
    </div>

    <!-- Danh sách nhân viên -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Tên đăng nhập</th>
              <th>Họ tên</th>
              <th>Email</th>
              <th>SĐT</th>
              <th>Vai trò</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="staffTable">
            <!-- Dữ liệu sẽ được load bằng JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal sửa nhân viên -->
  <div class="modal fade" id="editStaffModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Sửa thông tin nhân viên</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editStaffForm">
            <input type="hidden" id="editUserId">
            <div class="mb-3">
              <label class="form-label">Họ tên</label>
              <input type="text" class="form-control" id="editFullName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="editEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Số điện thoại</label>
              <input type="tel" class="form-control" id="editPhone" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Địa chỉ</label>
              <input type="text" class="form-control" id="editAddress">
            </div>
            <div class="mb-3">
              <label class="form-label">Vai trò</label>
              <select class="form-select" id="editRole" required>
                <option value="STAFF">Nhân viên</option>
                <option value="ADMIN">Quản trị viên</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" onclick="updateStaff()">Cập nhật</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/employer_management.js"></script>
</body>
</html>
