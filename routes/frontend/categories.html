<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý danh mục</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .page-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin: 20px auto;
      max-width: 1200px;
    }
    .page-header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      padding: 25px;
      margin-bottom: 30px;
    }
    .table-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .btn-custom {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 25px;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <a href="index.html" class="btn btn-secondary back-btn">
    <i class="fa-solid fa-arrow-left me-2"></i>Về trang chủ
  </a>

  <div class="container-fluid">
    <div class="page-container">
      <div class="page-header">
        <h2 class="mb-0">
          <i class="fa-solid fa-layer-group me-3"></i>Quản lý danh mục
        </h2>
        <p class="mb-0 mt-2">Tạo và quản lý các danh mục sản phẩm</p>
      </div>

      <div class="form-card">
        <h5 class="mb-3">
          <i class="fa-solid fa-plus-circle text-primary me-2"></i>Thêm danh mục mới
        </h5>
        <div class="row">
          <div class="col-md-6">
            <input id="categoryName" class="form-control mb-3" placeholder="Tên danh mục *" required>
          </div>
          <div class="col-md-6">
            <input id="categoryDesc" class="form-control mb-3" placeholder="Mô tả (tùy chọn)">
          </div>
        </div>
        <button id="addCategoryBtn" class="btn btn-custom">
          <i class="fa-solid fa-save me-2"></i>Thêm danh mục
        </button>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-dark">
              <tr>
                <th><i class="fa-solid fa-hashtag me-2"></i>ID</th>
                <th><i class="fa-solid fa-tag me-2"></i>Tên danh mục</th>
                <th><i class="fa-solid fa-align-left me-2"></i>Mô tả</th>
                <th><i class="fa-solid fa-cogs me-2"></i>Thao tác</th>
              </tr>
            </thead>
            <tbody id="categoryTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Modal sửa danh mục -->
      <div class="modal fade" id="editCategoryModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Sửa danh mục</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editCategoryId">
              <div class="mb-3">
                <label class="form-label">Tên danh mục</label>
                <input type="text" id="editCategoryName" class="form-control">
              </div>
              <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <input type="text" id="editCategoryDesc" class="form-control">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
              <button type="button" class="btn btn-primary" onclick="saveEditCategory()">Lưu</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/api.js?v=1"></script>
  <script src="./js/categories.js?v=1"></script>
</body>
</html>
