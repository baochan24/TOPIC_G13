<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý sản phẩm</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <style>
    body {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .page-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin: 20px auto;
      max-width: 1400px;
    }
    .page-header {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      color: #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      padding: 25px;
      margin-bottom: 30px;
    }
    .table-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .btn-custom {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      border-radius: 25px;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
    }
    .imei-btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      border-radius: 25px;
      padding: 8px 20px;
      transition: all 0.3s ease;
    }
    .imei-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <a href="index.html" class="btn btn-secondary back-btn">
    <i class="fa-solid fa-arrow-left me-2"></i>Về trang chủ
  </a>

  <div class="container-fluid">
    <div class="page-container">
      <div class="page-header">
        <h2 class="mb-0">
          <i class="fa-solid fa-box me-3"></i>Quản lý sản phẩm
        </h2>
        <p class="mb-0 mt-2">Thêm, sửa, xóa và quản lý thông tin sản phẩm</p>
      </div>

      <!-- Form thêm sản phẩm -->
      <div class="form-card">
        <h5 class="mb-3">
          <i class="fa-solid fa-plus-circle text-danger me-2"></i>Thêm sản phẩm mới
        </h5>
        <form id="productForm">
          <div class="row">
            <div class="col-md-4">
              <input type="text" id="productId" class="form-control mb-3" placeholder="Mã sản phẩm" required>
            </div>
            <div class="col-md-4">
              <input type="text" id="productName" class="form-control mb-3" placeholder="Tên sản phẩm" required>
            </div>
            <div class="col-md-4">
              <input type="text" id="brand" class="form-control mb-3" placeholder="Thương hiệu" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <input type="text" id="categoryId" class="form-control mb-3" placeholder="Mã danh mục" required>
            </div>
            <div class="col-md-4">
              <input type="number" id="basePrice" class="form-control mb-3" placeholder="Giá cơ bản" step="0.01" required>
            </div>
            <div class="col-md-4">
              <input type="number" id="warrantyPeriod" class="form-control mb-3" placeholder="Thời gian bảo hành (tháng)" required>
            </div>
          </div>
          <button type="submit" class="btn btn-custom">
            <i class="fa-solid fa-save me-2"></i>Thêm sản phẩm
          </button>
        </form>
      </div>

      <!-- Phần import IMEI -->
      <div class="form-card">
        <h5 class="mb-3">
          <i class="fa-solid fa-upload text-info me-2"></i>Import IMEI cho sản phẩm
        </h5>
        <form id="imeiForm">
          <div class="row">
            <div class="col-md-4">
              <input type="text" id="importProductId" class="form-control mb-3" placeholder="Mã sản phẩm" required>
            </div>
            <div class="col-md-4">
              <input type="text" id="imeiSerial" class="form-control mb-3" placeholder="IMEI Serial" required>
            </div>
            <div class="col-md-4">
              <select id="condition" class="form-control mb-3">
                <option value="NEW">Mới</option>
                <option value="USED">Đã sử dụng</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn imei-btn">
            <i class="fa-solid fa-barcode me-2"></i>Import IMEI
          </button>
        </form>
      </div>

      <!-- Phần kiểm tra IMEI -->
      <div class="form-card">
        <h5 class="mb-3">
          <i class="fa-solid fa-search text-warning me-2"></i>Kiểm tra IMEI
        </h5>
        <div class="row">
          <div class="col-md-8">
            <input type="text" id="checkImei" class="form-control" placeholder="Nhập IMEI để kiểm tra">
          </div>
          <div class="col-md-4">
            <button id="checkImeiBtn" class="btn btn-warning w-100">
              <i class="fa-solid fa-magnifying-glass me-2"></i>Kiểm tra
            </button>
          </div>
        </div>
        <div id="imeiResult" class="mt-3"></div>
      </div>

      <!-- Bảng danh sách sản phẩm -->
      <div class="table-card">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="productsTable">
            <thead class="table-dark">
              <tr>
                <th><i class="fa-solid fa-hashtag me-1"></i>ID</th>
                <th><i class="fa-solid fa-tag me-1"></i>Tên</th>
                <th><i class="fa-solid fa-building me-1"></i>Thương hiệu</th>
                <th><i class="fa-solid fa-layer-group me-1"></i>Category</th>
                <th><i class="fa-solid fa-dollar-sign me-1"></i>Giá</th>
                <th><i class="fa-solid fa-shield-alt me-1"></i>Bảo hành</th>
                <th><i class="fa-solid fa-cogs me-1"></i>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/product.js"></script>


</body>
</html>
