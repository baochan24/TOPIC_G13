<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Báo cáo | EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .page-container { max-width: 1000px; margin: 20px auto; }
    .card { border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .back-btn { position: fixed; top: 16px; left: 16px; z-index: 1000; }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Trang chủ</a>

  <div class="container page-container">
    <div class="card">
      <div class="card-header bg-info text-white">
        <h5 class="mb-0"><i class="fa-solid fa-chart-line me-2"></i>Lập báo cáo thống kê</h5>
      </div>
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-md-3">
            <label class="form-label">Loại báo cáo</label>
            <select id="reportType" class="form-select">
              <option value="revenue">Doanh thu</option>
              <option value="inventory">Tồn kho</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Từ ngày</label>
            <input type="date" id="startDate" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Đến ngày</label>
            <input type="date" id="endDate" class="form-control">
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-info w-100" onclick="generateReport()"><i class="fa-solid fa-play me-1"></i>Tạo báo cáo</button>
          </div>
        </div>
        <p class="text-muted small">Lưu ý: Báo cáo doanh thu cần chọn khoảng ngày. Báo cáo tồn kho không dùng ngày.</p>

        <div id="reportOutput" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/reports.js"></script>
</body>
</html>
