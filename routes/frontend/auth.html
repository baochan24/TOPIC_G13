<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập | EMS</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style/style.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 380px;">
  <div class="text-center mb-4">
    <i class="fa-solid fa-warehouse fa-3x text-primary mb-2"></i>
    <h4 class="fw-bold">EMS Login</h4>
    <small class="text-muted">Electronic Management System</small>
  </div>

  <div id="errorBox" class="alert alert-danger d-none"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label">Tên đăng nhập</label>
      <input type="text" class="form-control" id="username" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Mật khẩu</label>
      <input type="password" class="form-control" id="password" required>
    </div>

    <button class="btn btn-primary w-100" type="submit">
      <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng nhập
    </button>
  </form>

  <div class="text-center mt-3">
    <small class="text-muted">© 2026 EMS | SE Project</small>
  </div>
</div>

<script src="./js/api.js?v=1"></script>
<script src="./js/auth.js?v=1"></script>

</body>
</html>
