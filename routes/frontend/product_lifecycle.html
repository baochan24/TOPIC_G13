<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vòng đời sản phẩm | EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .page-container { max-width: 1000px; margin: 20px auto; }
    .card { border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 1rem; }
    .back-btn { position: fixed; top: 16px; left: 16px; z-index: 1000; }
    .timeline { position: relative; padding-left: 30px; }
    .timeline::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: #007bff; }
    .timeline-item { position: relative; margin-bottom: 20px; }
    .timeline-item::before { content: ''; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #007bff; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; }
    .status-in_stock { background: #28a745; color: white; }
    .status-sold { background: #dc3545; color: white; }
    .status-warranty { background: #ffc107; color: black; }
    .status-defect { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Trang chủ</a>

  <div class="container page-container">
    <h4 class="mb-3"><i class="fa-solid fa-history me-2"></i>Vòng đời sản phẩm</h4>

    <!-- Form tra cứu -->
    <div class="card">
      <div class="card-header"><i class="fa-solid fa-search me-2"></i>Tra cứu theo IMEI</div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-10"><input type="text" id="imeiInput" class="form-control" placeholder="Nhập IMEI"></div>
          <div class="col-md-2"><button class="btn btn-primary w-100" onclick="lookupLifecycle()">Tra cứu</button></div>
        </div>
      </div>
    </div>

    <!-- Kết quả -->
    <div id="resultCard" class="card d-none">
      <div class="card-header"><i class="fa-solid fa-info-circle me-2"></i>Thông tin sản phẩm</div>
      <div class="card-body">
        <div id="productInfo"></div>
        <hr>
        <h6>Lịch sử trạng thái:</h6>
        <div id="lifecycleTimeline" class="timeline"></div>
      </div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/product_lifecycle.js"></script>
</body>
</html>
