<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kiểm kê IMEI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .page-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin: 20px auto;
      max-width: 1200px;
    }
    .page-header {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      color: #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      padding: 25px;
      margin-bottom: 30px;
    }
    .table-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .btn-custom {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 25px;
      padding: 10px 30px;
      transition: all 0.3s ease;
    }
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .adjust-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
      border: none;
      border-radius: 25px;
      padding: 8px 20px;
      transition: all 0.3s ease;
    }
    .adjust-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <a href="index.html" class="btn btn-secondary back-btn">
    <i class="fa-solid fa-arrow-left me-2"></i>Về trang chủ
  </a>

  <div class="container-fluid">
    <div class="page-container">
      <div class="page-header">
        <h2 class="mb-0">
          <i class="fa-solid fa-barcode me-3"></i>Kiểm kê IMEI
        </h2>
        <p class="mb-0 mt-2">Đối chiếu tồn kho và cập nhật IMEI</p>
      </div>

      <!-- Chọn Check ID -->
      <div class="form-card">
        <h5 class="mb-3">
          <i class="fa-solid fa-list-check text-primary me-2"></i>Chọn phiên kiểm kê
        </h5>
        <input type="number" id="checkId" class="form-control" placeholder="Check ID (ví dụ: 1)" value="1">
      </div>

      <!-- Scan IMEI -->
      <div class="form-card">
        <h5 class="mb-3">
          <i class="fa-solid fa-qrcode text-success me-2"></i>Scan IMEI
        </h5>
        <form id="scanForm">
          <div class="row">
            <div class="col-md-6">
              <input type="text" id="imeiSerial" class="form-control mb-3" placeholder="IMEI Serial" required>
            </div>
            <div class="col-md-6">
              <select id="actualStatus" class="form-control mb-3" required>
                <option value="IN_STOCK">Có trong kho</option>
                <option value="MISSING">Thiếu</option>
                <option value="EXTRA">Thừa</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-custom">
            <i class="fa-solid fa-plus me-2"></i>Scan IMEI
          </button>
        </form>
      </div>

      <!-- Kết quả kiểm kê -->
      <div class="table-card">
        <div class="card-header bg-light">
          <h5 class="mb-0">
            <i class="fa-solid fa-chart-bar me-2"></i>Kết quả kiểm kê
          </h5>
        </div>
        <div class="card-body">
          <button id="loadResultsBtn"
  class="btn btn-info mb-3">
            <i class="fa-solid fa-eye me-2"></i>Xem kết quả
          </button>
          <div class="table-responsive">
            <table class="table table-hover mb-0" id="resultsTable">
              <thead class="table-dark">
                <tr>
                  <th><i class="fa-solid fa-hashtag me-1"></i>IMEI</th>
                  <th><i class="fa-solid fa-database me-1"></i>Trạng thái hệ thống</th>
                  <th><i class="fa-solid fa-check me-1"></i>Trạng thái thực tế</th>
                  <th><i class="fa-solid fa-balance-scale me-1"></i>Khớp</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Điều chỉnh tồn kho -->
      <div class="form-card">
        <h5 class="mb-3">
          <i class="fa-solid fa-tools text-warning me-2"></i>Điều chỉnh tồn kho
        </h5>
        <button 
        id="adjustStockBtn"
  class="btn btn-danger">
          <i class="fa-solid fa-wrench me-2"></i>Điều chỉnh stock
        </button>
        <div id="adjustResult" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
<script src="js/stock_check.js"></script>

</body>
</html>
