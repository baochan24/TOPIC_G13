<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhập kho IMEI | EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .page-container { max-width: 1100px; margin: 20px auto; }
    .card { border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 1rem; }
    .back-btn { position: fixed; top: 16px; left: 16px; z-index: 1000; }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Trang chủ</a>

  <div class="container page-container">
    <h4 class="mb-3"><i class="fa-solid fa-warehouse me-2"></i>Nhập kho & Tra cứu IMEI</h4>

    <!-- Nhập 1 IMEI -->
    <div class="card">
      <div class="card-header"><i class="fa-solid fa-plus me-2"></i>Nhập 1 IMEI</div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-4"><input type="text" id="impProductId" class="form-control" placeholder="Mã sản phẩm *"></div>
          <div class="col-md-4"><input type="text" id="impImei" class="form-control" placeholder="IMEI *"></div>
          <div class="col-md-2">
            <select id="impCondition" class="form-select">
              <option value="NEW">Mới</option>
              <option value="USED">Đã dùng</option>
            </select>
          </div>
          <div class="col-md-2"><button id="importOneBtn" class="btn btn-primary w-100">Nhập</button></div>
        </div>
      </div>
    </div>

    <!-- Nhập hàng loạt -->
    <div class="card">
      <div class="card-header"><i class="fa-solid fa-layer-group me-2"></i>Nhập hàng loạt</div>
      <div class="card-body">
        <div class="mb-2">
          <input type="text" id="batchProductId" class="form-control d-inline-block w-auto me-2" placeholder="Mã sản phẩm *">
          <span class="text-muted small">Mỗi IMEI một dòng:</span>
        </div>
        <textarea id="batchImeis" class="form-control font-monospace" rows="4" placeholder="IMEI1&#10;IMEI2&#10;..."></textarea>
        <button id="importBatchBtn" class="btn btn-info mt-2">Nhập hàng loạt</button>
      </div>
    </div>

    <!-- Tra cứu IMEI -->
    <div class="card">
      <div class="card-header"><i class="fa-solid fa-search me-2"></i>Tra cứu IMEI</div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-10"><input type="text" id="lookupImei" class="form-control" placeholder="Nhập IMEI"></div>
          <div class="col-md-2"><button id="lookupImeiBtn" class="btn btn-secondary w-100">Tra cứu</button></div>
        </div>
        <div id="lookupResult" class="mt-2"></div>
        <div id="statusUpdate" class="mt-2 d-none">
          <label class="form-label">Cập nhật trạng thái:</label>
          <select id="newStatus" class="form-select w-auto d-inline-block">
            <option value="IN_STOCK">Trong kho</option>
            <option value="SOLD">Đã bán</option>
            <option value="WARRANTY">Bảo hành</option>
            <option value="DEFECT">Lỗi</option>
          </select>
          <button id="updateImeiStatusBtn" class="btn btn-sm btn-warning ms-2">Cập nhật</button>
        </div>
      </div>
    </div>

    <!-- Báo cáo tồn kho -->
    <div class="card">
      <div class="card-header"><i class="fa-solid fa-chart-pie me-2"></i>Báo cáo tồn kho</div>
      <div class="card-body">
        <button id="loadInventoryReportBtn" class="btn btn-outline-primary mb-2">Tải báo cáo</button>
        <div class="table-responsive">
          <table class="table table-sm table-hover" id="reportTable">
            <thead class="table-dark"><tr><th>Mã SP</th><th>Tổng</th><th>Trong kho</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/api.js?v=1"></script>
  <script src="./js/inventoryImei.js?v=1"></script>
</body>
</html>
